<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Microphone, headphones and cable starter bundle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="1" stop-color="#5a3d5c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9bdd3"/>
      <stop offset="0.5" stop-color="#f1f2f8"/>
      <stop offset="1" stop-color="#a3a8c2"/>
    </linearGradient>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#8d92b0"/>
      <circle cx="6" cy="6" r="2.6" fill="#2b2d42" opacity="0.55"/>
    </pattern>
    <clipPath id="capsule"><rect x="130" y="70" width="100" height="170" rx="50"/></clipPath>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="215" r="170" fill="#f4b942" opacity="0.1"/>

  <!-- headphones (back right) -->
  <g transform="translate(90 20)">
    <path d="M250 260 V225 A100 100 0 0 1 450 225 V260" fill="none" stroke="#f4b942" stroke-width="16" stroke-linecap="round"/>
    <rect x="222" y="248" width="66" height="106" rx="30" fill="url(#metal)"/>
    <rect x="270" y="262" width="30" height="80" rx="14" fill="#1b1c2c"/>
    <rect x="412" y="248" width="66" height="106" rx="30" fill="url(#metal)"/>
    <rect x="400" y="262" width="30" height="80" rx="14" fill="#1b1c2c"/>
  </g>

  <!-- microphone (front left) -->
  <g>
    <path d="M110 200 A70 70 0 0 0 250 200" fill="none" stroke="#f4b942" stroke-width="9" stroke-linecap="round"/>
    <rect x="173" y="262" width="14" height="70" fill="#f4b942"/>
    <g clip-path="url(#capsule)">
      <rect x="130" y="70" width="100" height="170" fill="url(#mesh)"/>
      <rect x="130" y="70" width="100" height="170" fill="url(#metal)" opacity="0.35"/>
    </g>
    <rect x="130" y="70" width="100" height="170" rx="50" fill="none" stroke="#e6e8f2" stroke-width="4"/>
    <rect x="126" y="160" width="108" height="12" rx="6" fill="#f4b942"/>
    <rect x="110" y="326" width="140" height="20" rx="10" fill="#f4b942"/>
  </g>

  <!-- cable -->
  <path d="M250 336 C330 420 400 300 480 390 S540 400 560 380" fill="none" stroke="#e6e8f2" stroke-width="6" stroke-linecap="round"/>
  <rect x="546" y="366" width="34" height="30" rx="6" fill="#f4b942" transform="rotate(-24 563 381)"/>
</svg>
