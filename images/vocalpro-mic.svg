<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-label="Condenser microphone on a stand">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="1" stop-color="#4a4e73"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9bdd3"/>
      <stop offset="0.45" stop-color="#f1f2f8"/>
      <stop offset="1" stop-color="#a3a8c2"/>
    </linearGradient>
    <pattern id="mesh" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#8d92b0"/>
      <circle cx="7" cy="7" r="3" fill="#2b2d42" opacity="0.55"/>
    </pattern>
    <clipPath id="capsule"><rect x="240" y="60" width="120" height="200" rx="60"/></clipPath>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="200" r="150" fill="#f4b942" opacity="0.12"/>
  <circle cx="300" cy="200" r="105" fill="#f4b942" opacity="0.1"/>
  <path d="M212 190 A88 88 0 0 0 388 190" fill="none" stroke="#f4b942" stroke-width="10" stroke-linecap="round"/>
  <rect x="293" y="278" width="14" height="72" fill="#f4b942"/>
  <g clip-path="url(#capsule)">
    <rect x="240" y="60" width="120" height="200" fill="url(#mesh)"/>
    <rect x="240" y="60" width="120" height="200" fill="url(#metal)" opacity="0.35"/>
  </g>
  <rect x="240" y="60" width="120" height="200" rx="60" fill="none" stroke="#e6e8f2" stroke-width="4"/>
  <rect x="236" y="168" width="128" height="14" rx="7" fill="#f4b942"/>
  <ellipse cx="300" cy="372" rx="96" ry="16" fill="#111" opacity="0.35"/>
  <rect x="216" y="346" width="168" height="22" rx="11" fill="#f4b942"/>
</svg>
